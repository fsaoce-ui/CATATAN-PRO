name: Build CATATAN PRO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -t CATATAN-PRO-GitHub-Upload.zip
          unzip -o CATATAN-PRO-GitHub-Upload.zip -d source
          test -f source/android/app/build.gradle

      - name: Build APK
        working-directory: source/android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: test -s source/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CATATAN-PRO-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
