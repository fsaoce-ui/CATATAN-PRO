name: Build CATATAN PRO APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: |
          unzip -t CATATAN-PRO-GitHub-Upload.zip
          unzip -o CATATAN-PRO-GitHub-Upload.zip -d source
          test -f source/android/app/build.gradle

      - name: Harden Google sign-in return handling
        run: |
          echo '' | base64 -d > source/android/app/src/main/java/com/rewinding/catatanpro/MainActivity.java

      - name: Fix Google sign-in callback handling
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/android/app/src/main/java/com/rewinding/catatanpro/MainActivity.java")
          s = p.read_text()
          old = """        if (resultCode != RESULT_OK || data == null) {
                    authError("Proses login Google dibatalkan atau tidak mengembalikan data. Silakan coba lagi.");
                    return;
                }
                try {
                    GoogleSignInAccount account = GoogleSignIn.getSignedInAccountFromIntent(data).getResult(ApiException.class);"""
          new = """        Log.i(TAG, "Google sign-in callback: resultCode=" + resultCode + ", dataNull=" + (data == null));
                if (data == null) {
                    authError("Google tidak mengembalikan data akun. Silakan coba login kembali.");
                    return;
                }
                try {
                    // Coba baca intent hasil akun meskipun resultCode bukan RESULT_OK.
                    GoogleSignInAccount account = GoogleSignIn.getSignedInAccountFromIntent(data).getResult(ApiException.class);"""
          if old not in s:
              raise SystemExit("Pola onActivityResult Build 19 tidak ditemukan; build dihentikan agar tidak membuat APK yang salah.")
          p.write_text(s.replace(old, new, 1))
          print("Google sign-in callback patch applied.")
          PY

      - name: Publish extracted source for integration
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p android
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/catatan-google-services.json
          fi
          cp -a source/android/. android/
          if [ -f /tmp/catatan-google-services.json ]; then
            cp /tmp/catatan-google-services.json android/app/google-services.json
            cp /tmp/catatan-google-services.json source/android/app/google-services.json
          fi
          git add android/
          if ! git diff --cached --quiet; then
            git commit -m "Extract Android project source"
            git push
          fi


      - name: Create stable debug signing key if missing
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E 'SHA1:|SHA256:'

      - name: Restore stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: catatan-pro-debug-keystore-v2

      - name: Build APK
        working-directory: source/android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: test -s source/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CATATAN-PRO-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
