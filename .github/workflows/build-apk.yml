name: Build CATATAN PRO APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check uploaded project archive
        run: |
          test -f CATATAN-PRO-GitHub-Upload.zip
          unzip -t CATATAN-PRO-GitHub-Upload.zip
          unzip -l CATATAN-PRO-GitHub-Upload.zip | head -80

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's Ubuntu runner already includes Android SDK. Avoid setup-android,
      # which currently tries to install the removed legacy "tools" package.
      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -n "$ANDROID_HOME"
          command -v sdkmanager
          sdkmanager --version

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Android project
        run: |
          unzip -o CATATAN-PRO-GitHub-Upload.zip -d source
          test -f source/android/build.gradle
          test -f source/android/app/build.gradle
          test -f source/android/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: source/android
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK
        run: |
          test -s source/android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh source/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CATATAN-PRO-APK
          path: source/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
